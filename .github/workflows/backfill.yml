name: Conti in chiaro — Backfill Storico

# Solo manuale: dalla tab Actions → "Run workflow".
# Rilancialo più volte finché il log non dice "Archivio esaurito".
on:
  workflow_dispatch:
    inputs:
      max_atti:
        description: 'Massimo atti da elaborare in questo run'
        required: false
        default: '300'
      anno_min:
        description: 'Anno minimo (archivio del portale: da maggio 2021)'
        required: false
        default: '2021'
      solo_censimento:
        description: 'Solo censimento archivio (nessuna elaborazione)'
        type: boolean
        required: false
        default: false
      riestrai_regex:
        description: 'Rielabora con Groq le spese estratte col fallback regex'
        type: boolean
        required: false
        default: false
      riestrai_tutto:
        description: 'Rielabora TUTTE le spese con schema obsoleto (nuovi campi)'
        type: boolean
        required: false
        default: false
      riestrai_incerti:
        description: 'Rielabora solo le spese con importo dubbio (mostrate come «da verificare»)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: conti-in-chiaro-run
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-22.04
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Installa Tesseract e Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ita poppler-utils

      - name: Configura Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze Python
        run: pip install -r requirements.txt

      - name: Esegui backfill
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          FLAGS="--max-atti ${{ inputs.max_atti }} --anno-min ${{ inputs.anno_min }}"
          if [ "${{ inputs.solo_censimento }}" = "true" ]; then
            FLAGS="$FLAGS --solo-censimento"
          fi
          if [ "${{ inputs.riestrai_regex }}" = "true" ]; then
            FLAGS="$FLAGS --riestrai-regex"
          fi
          if [ "${{ inputs.riestrai_incerti }}" = "true" ]; then
            FLAGS="$FLAGS --riestrai-incerti"
          fi
          if [ "${{ inputs.riestrai_tutto }}" = "true" ]; then
            FLAGS="$FLAGS --riestrai-tutto"
          fi
          python scripts/backfill.py $FLAGS
          python scripts/verifica_dati.py

      - name: Aggiorna dati del sito
        run: python scripts/genera_sito.py

      - name: Salva risultati nel repository
        run: |
          git config user.name "ContiInChiaroBot"
          git config user.email "bot@conti-in-chiaro.local"
          # Vedi la nota in aggiornamento.yml: senza il driver il merge dei
          # JSON generati è testuale e può inserire marcatori di conflitto.
          git config merge.mantieni-locale.driver true
          git pull --rebase --autostash
          # Il pull può comunque produrre dati corrotti: meglio fallire qui
          # che pubblicare un sito che non riesce più a leggere i propri dati.
          python scripts/verifica_dati.py
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Backfill storico: $(date '+%Y-%m-%d %H:%M')"
          git push
